stages:
- name: Build
  steps:
  - runScriptConfig:
      image: golang:latest
      shellScript: echo build
- name: Publish
  steps:
  - publishImageConfig:
      dockerfilePath: ./Dockerfile
      buildContext: .
      tag: antiwar/app:v1
- name: Deploy
  steps:
  - applyYamlConfig:
      path: ./deployment.yaml
timeout: 60
notification: {}
