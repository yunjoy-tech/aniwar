# This file is a template, and might need editing before it works on your project.
# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/ee/development/cicd/templates.html
# This specific template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Getting-Started.gitlab-ci.yml

# This is a sample GitLab CI/CD configuration file that should run without any modifications.
# It demonstrates a basic 3 stage CI/CD pipeline. Instead of real tests or scripts,
# it uses echo commands to simulate the pipeline execution.
#
# A pipeline is composed of independent jobs that run scripts, grouped into stages.
# Stages run in sequential order, but jobs within stages run in parallel.
#
# For more information, see: https://docs.gitlab.com/ee/ci/yaml/index.html#stages

#image: golang:1.18.4
before_script:
  - echo "before script"

variables:
  CONFIGURATION: "Debug"

stages:          # List of stages for jobs, and their order of execution
  #- build
  #- test
  #- deploy
  #- notify

build-job:       # This job runs in the build stage, which runs first.
  stage: build
  tags:
    - build
  script:
    - echo "Compiling the code..."
    - echo "Compile complete."
    - set -ex
    - go version
    - unset GOPROXY
    - go env -w GO111MODULE=on
    - go env -w GOPROXY=https://goproxy.cn,https://gitlab.musadisca-games.com/wangxw,direct
    - go env -w GOPRIVATE="*.musadisca-games.com"
    #- go env -w GONOSUMDB=gitlab.musadisca-games.com
    #- go env -w GOPRIVATE="gitlab.musadisca-games.com"
    - export PATH=$PATH:$GOPATH/bin
    - echo $PATH
    - go env

    - echo "================> load musae"
    - rm -rf ../musae
    - git clone git@gitlab.musadisca-games.com:wangxw/musae.git ../musae/
    - git submodule update --init --recursive
    - git pull origin main
    - git submodule update

    - rm -rf ../design
    - svn co svn://192.168.2.15/design/tools/protos ../design/tools/protos
    - svn co svn://192.168.2.15/design/数据表格 ../design/数据表格

    - echo "make res"
    - mkdir -m 777 -p ./src/excel/data
    - mkdir -m 777 -p ./src/excel/pb
    - mkdir -m 777 -p ./src/excel/proto
    - mkdir -m 777 -p ./output/data
    - chmod +x ./src/excel/protoc
    - chmod +x ./src/excel/protoc-gen-go
    - chmod +x ./src/excel/protoc-gen-go-grpc
    - chmod +x ./src/proto/protoc
    - chmod +x ./src/proto/protoc-gen-go
    - chmod +x ./src/proto/protoc-gen-go-grpc
    - chmod +x ./tools/auto-export-table-tools/bin/protoc-3.20.1/bin/protoc

    - echo "make auto-export-table-tools"
    - cd ./tools/auto-export-table-tools
    - bash ./install.sh
    - bash ./start.sh
    - cd -
    - echo "make excel"
    - cd  ./src/excel
    - bash ./build.sh
    - cd -
    - echo "make proto"
    - cd ./src/proto
    - bash ./build.sh
    - cd -
    - echo "golangci-lint"
    - make lint
    - echo "make linux"
    - make linux
    - echo "make end"
unit-test-job:   # This job runs in the test stage.
  stage: test    # It only starts when the job in the build stage completes successfully.
  tags:
    - build
  script:
    - echo "Running unit tests... This will take about 60 seconds."
    - sleep 1
    - echo "Code coverage is 90%"

lint-test-job:   # This job also runs in the test stage.
  stage: test    # It can run at the same time as unit-test-job (in parallel).
  tags:
    - build
  script:
    - echo "Linting code... This will take about 10 seconds."
    - sleep 1
    - echo "No lint issues found."

deploy-job:      # This job runs in the deploy stage.
  stage: deploy  # It only runs when *both* jobs in the test stage complete successfully.
  tags:
    - build
  script:
    - echo "Deploying application..."
    - echo "Application successfully deployed."

# 构建失败时的通知消息
notifyFailWeChat:
  stage: notify
  script:
    - curl 'https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=a3fd7888-491c-4fbe-b771-981ba9104c6f' -H 'Content-Type:application/json' -d "{\"msgtype\":\"markdown\",\"markdown\":{\"content\":\"aniwar项目构建结果：<font color=\\"warning\\">失败</font>\n>本次构建由：$GITLAB_USER_NAME 触发\n>项目名称：$CI_PROJECT_NAME\n>提交号：$CI_COMMIT_SHA\n>提交日志：$CI_COMMIT_MESSAGE\n>构建分支：$CI_COMMIT_BRANCH\n>流水线地址：[$CI_PIPELINE_URL]($CI_PIPELINE_URL)\"}}"
  tags:
    - build
  when: on_failure
# 构建成功时的通知消息
notifySuccessWeChat:
  stage: notify
  script:
    - curl 'https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=a3fd7888-491c-4fbe-b771-981ba9104c6f' -H 'Content-Type:application/json' -d "{\"msgtype\":\"markdown\",\"markdown\":{\"content\":\"aniwar项目构建结果：<font color=\\"info\\">成功</font>\n>请前往发布平台下载体验：[下载地址](http://app下载地址)\n>本次构建由：$GITLAB_USER_NAME 触发\n>项目名称：$CI_PROJECT_NAME\n>提交号：$CI_COMMIT_SHA\n>提交日志：$CI_COMMIT_MESSAGE\n>构建分支：$CI_COMMIT_BRANCH\n>流水线地址：[$CI_PIPELINE_URL]($CI_PIPELINE_URL)\"}}"
  tags:
    - build
  when: on_success
