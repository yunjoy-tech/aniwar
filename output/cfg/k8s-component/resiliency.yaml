apiVersion: dapr.io/v1alpha1
kind: Resiliency
metadata:
  name: resiliency
# similar to subscription and configuration specs, scopes lists the Dapr App IDs that this
# resiliency spec can be used by.
spec:
  # policies is where timeouts, retries and circuit breaker policies are defined.
  # each is given a name so they can be referred to from the targets section in the resiliency spec.
  policies:
    # timeouts are simple named durations.
    timeouts:
      general: 5s
      important: 60s  # 60s
      largeResponse: 10s # 10s

    # retries are named templates for retry configurations and are instantiated for life of the operation.
    retries:
      serviceRetry:
        policy: constant
        duration: 5s
        maxRetries: 0

      actorRetry:
        policy: constant
        duration: 5s
        maxRetries: 0

      stateRetry:
        policy: constant
        duration: 5s
        maxRetries: 10

      pubsubRetry:
        policy: constant
        duration: 5s
        maxRetries: 0 # 10

      important:
        policy: constant
        duration: 5s
        maxRetries: 30

      someOperation:
        policy: exponential
        maxInterval: 15s

      largeResponse:
        policy: constant
        duration: 5s
        maxRetries: 3

      generalRetry:
        policy: constant
        duration: 5s
        maxRetries: 0

      retryForever:
        policy: exponential
        maxInterval: 15s
        maxRetries: 0 # retry indefinitely

    # circuit breakers are automatically instantiated per component and app instance.
    # circuit breakers maintain counters that live as long as the Dapr sidecar is running. They are not persisted.
    circuitBreakers:
      serviceCB:
        maxRequests: 1
        interval: 8s
        timeout: 45s
        trip: consecutiveFailures > 8

      stateCB:
        maxRequests: 1
        interval: 8s
        timeout: 45s
        trip: consecutiveFailures > 8

      actorCB:
        maxRequests: 1
        interval: 8s
        timeout: 45s
        trip: consecutiveFailures > 8

      generalCB:
        maxRequests: 0
        timeout: 30s
        trip: consecutiveFailures >= 1

      simpleCB:
        maxRequests: 1
        timeout: 30s
        trip: consecutiveFailures >= 5

      pubsubCB:
        maxRequests: 1
        interval: 8s
        timeout: 45s
        trip: consecutiveFailures > 8

  # targets are what named policies are applied to. Dapr supports 3 target types - apps, components and actors
  targets:
    #apps:
      #appB:
      #  timeout: general
      #  retry: important
      #  # circuit breakers for services are scoped app instance.
      #  # when a breaker is tripped, that route is removed from load balancing for the configured `timeout` duration.
      #  circuitBreaker: simpleCB

    actors:
      UserActor: # custom Actor Type Name
        timeout: general
        retry: generalRetry
        # circuit breakers for actors are scoped by type, id, or both.
        # when a breaker is tripped, that type or id is removed from the placement table for the configured `timeout` duration.
        circuitBreaker: generalCB
        circuitBreakerScope: both ##
        circuitBreakerCacheSize: 5000

    components:
      # for state stores, policies apply to saving and retrieving state.
      redis-global: # any component name -- happens to be a state store here
        outbound:
          timeout: general
          retry: retryForever
          # circuit breakers for components are scoped per component configuration/instance. For example myRediscomponent.
          # when this breaker is tripped, all interaction to that component is prevented for the configured `timeout` duration.
          circuitBreaker: stateCB
      redis-cache: # any component name -- happens to be a state store here
        outbound:
          timeout: general
          retry: retryForever
          # circuit breakers for components are scoped per component configuration/instance. For example myRediscomponent.
          # when this breaker is tripped, all interaction to that component is prevented for the configured `timeout` duration.
          circuitBreaker: stateCB
      mongo-account: # any component name -- happens to be a state store here
        outbound:
          timeout: general
          retry: retryForever
          # circuit breakers for components are scoped per component configuration/instance. For example myRediscomponent.
          # when this breaker is tripped, all interaction to that component is prevented for the configured `timeout` duration.
          circuitBreaker: stateCB
      mongo-game: # any component name -- happens to be a state store here
        outbound:
          timeout: general
          retry: retryForever
          # circuit breakers for components are scoped per component configuration/instance. For example myRediscomponent.
          # when this breaker is tripped, all interaction to that component is prevented for the configured `timeout` duration.
          circuitBreaker: stateCB
      topic-global: # any component name -- happens to be another pubsub broker here
        outbound:
          timeout: general
          retry: generalRetry
          circuitBreaker: generalCB
        inbound: # inbound only applies to delivery from sidecar to app
          timeout: general
          retry: generalRetry
          circuitBreaker: generalCB
      topic-appid: # any component name -- happens to be another pubsub broker here
        outbound:
          timeout: general
          retry: generalRetry
          circuitBreaker: generalCB
        inbound: # inbound only applies to delivery from sidecar to app
          timeout: general
          retry: generalRetry
          circuitBreaker: generalCB
      topic-private: # any component name -- happens to be another pubsub broker here
        outbound:
          timeout: general
          retry: generalRetry
          circuitBreaker: generalCB
        inbound: # inbound only applies to delivery from sidecar to app
          timeout: general
          retry: generalRetry
          circuitBreaker: generalCB
