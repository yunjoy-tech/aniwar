apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: mongo-game
spec:
  type: state.mongodb
  version: v1
  initTimeout: 5m
  metadata:
  - name: host
    value: "10.14.1.94:27017" # Required. Example: "mongo-mongodb.default.svc.cluster.local:27017"
  - name: username
    value: "admin" # Optional. Example: "admin"
  - name: password
    value: "" # Optional.
  - name: databaseName
    value: "game" # Optional. default: "daprStore"
  - name: collectionName
    value: "player" # Optional. default: "daprCollection"
  - name: writeconcern
    value: "majority" # Optional.
  - name: readconcern
    value: "majority" # Optional.
  - name: actorStateStore
    value: "true"
  - name: keyPrefix
    value: "none"
