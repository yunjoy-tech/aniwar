apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: topic-private
spec:
  type: pubsub.redis
  version: v1
  metadata:
  - name: redisHost
    value: 10.14.1.94:6379
  - name: redisPassword
    value: ""
  - name: redisDB
    value: "6"
  - name: redeliverInterval
    value: "0"
  - name: processingTimeout
    value: "0"
  - name: queueDepth
    value: "2000"
  - name: concurrency
    value: "15"
  - name: ttlInSeconds
    value: "5"
  - name: maxLenApprox
    value: "2000"
  - name:   minIdleConns
    value: "2"
