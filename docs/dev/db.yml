version: '3.8'

services:
  redis:
    image: redis:7.2-alpine
    container_name: dev-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:16379:16379"  # 仅本机可访问
    volumes:
      - redis_data:/data
    environment:
      - TZ=Asia/Shanghai
    command: >
      redis-server
      --requirepass "123456"
      --appendonly yes
      --appendfilename "appendonly.aof"
      --save 900 1 300 10 60 10000
      --loglevel notice
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mongo:
    image: mongo:7.0-jammy
    container_name: dev-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"  # 仅本机可访问
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    environment:
      - TZ=Asia/Shanghai
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=123456
      - MONGO_INITDB_DATABASE=dapr_app
    command: --bind_ip_all --auth
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  redis_data:
  mongo_data:
  mongo_config: